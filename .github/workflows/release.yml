name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Resolve Version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build - ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: fastty-x86_64-unknown-linux-gnu.tar.gz
            deb_name: fastty_${{ needs.prepare.outputs.version }}_amd64.deb
            appimage_name: Fastty_${{ needs.prepare.outputs.version }}_amd64.AppImage
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: fastty-x86_64-apple-darwin.tar.gz
            dmg_name: fastty-x86_64-apple-darwin.dmg
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: fastty-aarch64-apple-darwin.tar.gz
            dmg_name: fastty-aarch64-apple-darwin.dmg
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: fastty-x86_64-pc-windows-msvc.zip
            msi_name: Fastty_${{ needs.prepare.outputs.version }}_x64.msi

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libxfixes-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Rebuild Wasm Client
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          ./build-wasm.sh

      - name: Build Binary (Release Mode)
        run: cargo build --release --target ${{ matrix.target }}

      # Empaquetado para Linux (Guardamos únicamente el binario autocontenido)
      - name: Package Binary (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/fastty dist/fastty
          cd dist
          tar -czf ../${{ matrix.artifact_name }} fastty
          cd ..

      # Paquete .deb para Debian/Ubuntu (doble clic o `sudo dpkg -i`)
      - name: Install cargo-deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y dpkg-dev
          cargo install cargo-deb --locked

      - name: Build DEB Package (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo deb --target ${{ matrix.target }} --no-build --output "${{ matrix.deb_name }}"
          ls -la "${{ matrix.deb_name }}"

      # AppImage universal para Linux (portable, sin necesidad de instalar nada)
      - name: Build AppImage (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get install -y libfuse2 imagemagick || sudo apt-get install -y libfuse2t64 imagemagick || true

          curl -fsSL -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-appimage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export PATH="$PWD:$PATH"

          # linuxdeploy only accepts icons at one of the XDG icon-theme sizes
          # (8..512 square); assets/fasttyIcon.png is 500x500, so resize a
          # copy down to a valid size rather than touching the shared asset.
          convert assets/fasttyIcon.png -resize 256x256 fastty-icon-256.png

          mkdir -p AppDir
          ./linuxdeploy \
            --appdir AppDir \
            --executable target/${{ matrix.target }}/release/fastty \
            --desktop-file packaging/linux/fastty.desktop \
            --icon-file fastty-icon-256.png \
            --icon-filename fastty \
            --output appimage

          mv Fastty-*.AppImage "${{ matrix.appimage_name }}"
          ls -la "${{ matrix.appimage_name }}"

      # macOS signing identity.
      #
      # macOS records its Gatekeeper decision against the app's designated
      # requirement. An ad-hoc signature embeds the content hash there, and the
      # hash changes on every build, so macOS treats every update as a different
      # app and asks the user to accept it again. A self-signed certificate with
      # a pinned leaf hash keeps the requirement identical across builds.
      #
      # With no certificate configured the release falls back to an ad-hoc
      # signature, which is the current behaviour. Run
      # tools/setup-signing-cert.sh once and add the three secrets to switch.
      - name: Import macOS signing identity
        if: runner.os == 'macOS'
        env:
          FASTTY_CERTIFICATE_P12_BASE64: ${{ secrets.FASTTY_CERTIFICATE_P12_BASE64 }}
          FASTTY_CERTIFICATE_PASSWORD: ${{ secrets.FASTTY_CERTIFICATE_PASSWORD }}
          FASTTY_SIGNING_IDENTITY: ${{ secrets.FASTTY_SIGNING_IDENTITY }}
        run: |
          PINNED="$(grep -v '^[[:space:]]*#' assets/macos-signing-requirement.txt | grep -v '^[[:space:]]*$')"
          if [ -z "$FASTTY_CERTIFICATE_P12_BASE64" ] || [ -z "$FASTTY_CERTIFICATE_PASSWORD" ] || [ -z "$FASTTY_SIGNING_IDENTITY" ]; then
            if echo "$PINNED" | grep -q 'REPLACE'; then
              echo "No signing identity configured. Falling back to an ad-hoc signature."
              echo "Run tools/setup-signing-cert.sh and add the FASTTY_CERTIFICATE_* secrets to stop macOS re-prompting after every update."
              exit 0
            fi
            # A pinned requirement makes the updater reject any bundle that does
            # not carry it, so an ad-hoc release here would lock every user out of
            # self-update with no in-app recovery. Fail now instead.
            echo "assets/macos-signing-requirement.txt pins a signing identity, but the"
            echo "FASTTY_CERTIFICATE_* secrets are missing. Restore the secrets, or put the"
            echo "requirement file back to its REPLACE placeholder."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/fastty-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$FASTTY_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/fastty-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          security import "$RUNNER_TEMP/fastty-signing.p12" -k "$KEYCHAIN" -P "$FASTTY_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -p codesigning "$KEYCHAIN" | grep -F "\"$FASTTY_SIGNING_IDENTITY\""
          echo "FASTTY_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/fastty-signing.p12"

      # Empaquetado para macOS (Creación del App Bundle profesional con su icono .icns)
      - name: Package Binary (macOS)
        if: runner.os == 'macOS'
        env:
          FASTTY_SIGNING_IDENTITY: ${{ secrets.FASTTY_SIGNING_IDENTITY }}
        run: |
          mkdir -p dist/Fastty.app/Contents/MacOS
          mkdir -p dist/Fastty.app/Contents/Resources

          # Copiar ejecutable e icono .icns
          cp target/${{ matrix.target }}/release/fastty dist/Fastty.app/Contents/MacOS/fastty
          cp assets/fasttyIcon.icns dist/Fastty.app/Contents/Resources/AppIcon.icns

          # Escribir el Info.plist de la app
          cat <<EOF > dist/Fastty.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>fastty</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.diegoleteliers10.fastty</string>
              <key>CFBundleName</key>
              <string>Fastty</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.12</string>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere usar Bluetooth.</string>
              <key>NSCameraUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere usar la cámara.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere usar el micrófono.</string>
              <key>NSLocationUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere acceder a tu ubicación.</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere acceder a tu ubicación mientras lo usas.</string>
              <key>NSContactsUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere acceder a tus contactos.</string>
              <key>NSCalendarsUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere acceder a tus calendarios.</string>
              <key>NSRemindersUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere acceder a tus recordatorios.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere acceder a tu fototeca.</string>
              <key>NSAppleEventsUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere controlar otras apps.</string>
              <key>NSLocalNetworkUsageDescription</key>
              <string>Un programa que ejecutaste en Fastty quiere acceder a la red local.</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Firma con la identidad estable cuando existe, y ad-hoc si no.
          # La identidad estable mantiene el mismo "designated requirement" en
          # cada build, que es lo que evita que macOS vuelva a pedir aceptacion.
          if [ -n "$FASTTY_SIGNING_KEYCHAIN" ] && [ -n "$FASTTY_SIGNING_IDENTITY" ]; then
            codesign --force --deep --options runtime --keychain "$FASTTY_SIGNING_KEYCHAIN" -s "$FASTTY_SIGNING_IDENTITY" dist/Fastty.app
            codesign --verify --deep --strict --verbose=2 dist/Fastty.app
            ACTUAL_REQUIREMENT="$(codesign -dr - dist/Fastty.app 2>&1 | sed -n 's/^#[[:space:]]*designated => //p')"
            EXPECTED_REQUIREMENT="$(grep -v '^[[:space:]]*#' assets/macos-signing-requirement.txt | grep -v '^[[:space:]]*$')"
            if [ "$ACTUAL_REQUIREMENT" != "$EXPECTED_REQUIREMENT" ]; then
              echo "Firma inesperada."
              echo "  actual:   $ACTUAL_REQUIREMENT"
              echo "  esperado: $EXPECTED_REQUIREMENT"
              exit 1
            fi
          else
            codesign --force --deep -s - dist/Fastty.app
          fi

          # Comprimir la estructura en .tar.gz
          cd dist
          tar -czf ../${{ matrix.artifact_name }} Fastty.app
          cd ..

      # Creación del .dmg (con symlink a /Applications) para distribución directa y Homebrew Cask
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          STAGING_DIR=$(mktemp -d)
          cp -R dist/Fastty.app "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "Fastty" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "${{ matrix.dmg_name }}"

          rm -rf "$STAGING_DIR"

      # Empaquetado para Windows (Incrusta el icono automáticamente gracias a build.rs y winres)
      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path target\${{ matrix.target }}\release\fastty.exe -Destination dist\fastty.exe
          Compress-Archive -Path dist\fastty.exe -DestinationPath ${{ matrix.artifact_name }}

      # Instalador .msi (WiX Toolset v3, preinstalado en el runner windows-latest)
      # Registra la app en el menú de inicio (accesos directos) y en
      # Panel de Control > Programas y características (automático para todo MSI).
      - name: Build MSI Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Join-Path $env:WIX 'bin\candle.exe'
          $light  = Join-Path $env:WIX 'bin\light.exe'
          $binDir = "target\${{ matrix.target }}\release"

          & $candle -nologo -arch x64 -dVersion="$env:VERSION" -dBinDir="$binDir" -out wix\main.wixobj wix\main.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed with exit code $LASTEXITCODE" }

          # sw69/sw91: expected, harmless ICE warnings for a deliberately
          # per-user-only install (Shortcut targets a file from a sibling
          # component in the same feature; files are per-user regardless of
          # ALLUSERS since we never offer a per-machine mode).
          & $light -nologo -ext WixUIExtension -sw69 -sw91 -out "${{ matrix.msi_name }}" wix\main.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed with exit code $LASTEXITCODE" }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

      - name: Upload DMG Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-dmg
          path: ${{ matrix.dmg_name }}
          retention-days: 1

      - name: Upload MSI Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-msi
          path: ${{ matrix.msi_name }}
          retention-days: 1

      - name: Upload DEB Artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-deb
          path: ${{ matrix.deb_name }}
          retention-days: 1

      - name: Upload AppImage Artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-appimage
          path: ${{ matrix.appimage_name }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten Artifacts Structure
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Extract Release Notes
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          awk -v ver="## $VERSION" '
            $0 ~ ver { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: release_notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-cask:
    name: Update Homebrew Cask
    needs: [prepare, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download macOS DMG Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-apple-darwin-dmg'
          path: dmgs
          merge-multiple: true

      - name: Compute Checksums
        id: sha
        run: |
          ARM_SHA=$(sha256sum dmgs/fastty-aarch64-apple-darwin.dmg | awk '{print $1}')
          INTEL_SHA=$(sha256sum dmgs/fastty-x86_64-apple-darwin.dmg | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "intel_sha=$INTEL_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Cask File
        run: |
          sed -i -E "s/version \"[^\"]+\"/version \"${VERSION}\"/" Casks/fastty.rb
          sed -i -E "s/arm:[[:space:]]+\"[a-f0-9]+\"/arm:   \"${{ steps.sha.outputs.arm_sha }}\"/" Casks/fastty.rb
          sed -i -E "s/intel:[[:space:]]+\"[a-f0-9]+\"/intel: \"${{ steps.sha.outputs.intel_sha }}\"/" Casks/fastty.rb
          cat Casks/fastty.rb

      - name: Commit and Push Cask Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/fastty.rb
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Homebrew cask to v${VERSION}"
            git push origin HEAD:main
          fi
