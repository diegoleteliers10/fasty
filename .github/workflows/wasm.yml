name: Web Client

# Rebuilds web/pkg whenever the wasm crate changes, so the gateway always
# embeds a fresh client without manual steps.

on:
  push:
    branches: [main]
    paths:
      - 'crates/fastty-wasm/**'
      - 'web/**'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Rebuild web/pkg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-pack

      - name: Build Wasm Client
        run: ./build-wasm.sh

      - name: Run Wasm Crate Tests
        run: cargo test -p fastty-wasm

      - name: Commit refreshed web/pkg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain web/pkg)" ]]; then
            git add web/pkg
            git commit -m "chore(web): rebuild wasm client from crates/fastty-wasm"
            git pull --rebase origin main
            git push
          else
            echo "No changes to web/pkg"
          fi
