name: CI

# Compila y prueba Fastty en los tres sistemas en cada PR. Antes de esto, el
# primer lugar donde se compilaba Linux/Windows era el release: un error de
# cfg(windows) tumbaba la publicacion para todos (paso en v0.28.1).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            run_tests: false
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
            run_tests: true
          - name: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            run_tests: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libxfixes-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Solo el crate raiz: fastty-wasm se compila para wasm32 en wasm.yml y
      # no tiene sentido compilarlo para el host.
      - name: Cargo check
        run: cargo check --locked -p fastty --lib --bins --target ${{ matrix.target }}

      # Los tests corren en macOS. La suite tiene casos de config,
      # keybindings y deteccion de procesos que asumen el entorno de macOS y
      # hoy fallan en paralelo en Linux. Linux y Windows igual compilan la
      # app completa, que es lo que atrapa los errores de cfg.
      - name: Cargo test
        if: matrix.run_tests
        # Este test depende de que el runner exponga una observacion del
        # proceso actual; en el runner de GitHub no la hay. El resto de la
        # suite (638 tests) corre igual.
        run: cargo test --locked -p fastty --no-fail-fast -- --skip process_state::tests::native_process_refresh_observes_the_current_process
