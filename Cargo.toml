[workspace]
members = [
    ".",
    "crates/fastty-wasm",
]

[package]
name = "fastty"
version = "0.21.5"
edition = "2021"

[lib]
name = "fastty"
path = "src/lib.rs"

[[bin]]
name = "fastty"
path = "src/main.rs"
required-features = []

[package.metadata.winres]
# Use the windows subsystem to hide console window

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
# runtime_shaders compiles GPUI's Metal shaders at app launch via
# makeLibraryWithSource instead of at build time via `xcrun metal`. The build
# time path needs full Xcode; the runtime path only needs Metal.framework,
# which ships with macOS. Drop this feature once Xcode is installed.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
] }
alacritty_terminal = { version = "0.26", default-features = false }
# Already in the lock file via alacritty_terminal; direct dep for unicode_width
# so table columns measure CJK/emoji as 2 cells instead of 1.
unicode-width = "0.2"
portable-pty = "0.8"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
notify-debouncer-mini = "0.7"
seahash = "4"
anyhow = "1"
parking_lot = "0.12"
raw-window-handle = "0.6"
rustix = { version = "1.1", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
notify-rust = "4"
git2 = { version = "0.21", default-features = false }
notify = "8"
dirs = "6"
icons = "0.18.3"
smallvec = "1"
fff-search = { version = "0.10.6", features = ["ripgrep"] }
miniz_oxide = "0.8"
ureq = { version = "2.12", features = ["json", "proxy-from-env"] }
schemars = { version = "0.8", features = ["derive"] }
base64 = "0.22"
semver = "1.0"
sha2 = "0.10"
hex = "0.4"


[build-dependencies]
winres = "0.1"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
core-text = "20"
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "parser_bench"
harness = false

[package.metadata.deb]
name = "fastty"
maintainer = "Diego Letelier <diegoleteliers10@users.noreply.github.com>"
copyright = "2025, Diego Letelier"
license-file = ["LICENSE", "0"]
extended-description = """\
Fastty is a modern, high-performance terminal emulator designed for speed, \
low memory usage, and seamless developer workflows. Built with Rust and GPUI, \
it offers GPU-accelerated rendering, a tabbed interface, built-in Git \
integration, and a fully configurable TOML-based setup."""
section = "utils"
priority = "optional"
# Keep the Debian package version identical to the crate version (no "-1"
# revision suffix), so the artifact is named fastty_<version>_amd64.deb.
revision = ""
assets = [
    ["target/release/fastty", "usr/bin/", "755"],
    ["packaging/linux/fastty.desktop", "usr/share/applications/", "644"],
    ["assets/fasttyIcon.png", "usr/share/icons/hicolor/512x512/apps/fastty.png", "644"],
    ["assets/fasttyIcon.png", "usr/share/pixmaps/fastty.png", "644"],
    ["README.md", "usr/share/doc/fastty/README.md", "644"],
]
