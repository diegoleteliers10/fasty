[package]
name = "fastty"
version = "0.7.1"
edition = "2021"

[lib]
name = "fastty"
path = "src/lib.rs"

[[bin]]
name = "fastty"
path = "src/main.rs"
required-features = []

[package.metadata.winres]
# Use the windows subsystem to hide console window

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
] }
alacritty_terminal = { version = "0.24", default-features = false }
portable-pty = "0.8"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
notify-debouncer-mini = "0.4"
seahash = "4"
anyhow = "1"
parking_lot = "0.12"
raw-window-handle = "0.6"
rustix = { version = "0.38", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
notify-rust = "4"
git2 = { version = "0.19", default-features = false }
notify = "6"
dirs = "6"
icons = "0.18.3"
smallvec = "1"

[build-dependencies]
winres = "0.1"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
core-text = "20"
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser_bench"
harness = false

