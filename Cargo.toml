[package]
name = "fasty"
version = "0.1.0"
edition = "2021"

[lib]
name = "fasty"
path = "src/lib.rs"

[[bin]]
name = "fasty"
path = "src/main.rs"
required-features = []

[dependencies]
gpui = "0.2.2"
portable-pty = "0.8"
alacritty_terminal = { git = "https://github.com/alacritty/alacritty", package = "alacritty_terminal" }
unicode-width = "0.1"
flume = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
futures = "0.3"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
gpui-component = "0.5.1"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[features]
default = []
wayland = ["gpui/wayland"]
x11 = ["gpui/x11"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
