[package]
name = "fastty"
version = "0.5.8"
edition = "2021"

[lib]
name = "fastty"
path = "src/lib.rs"

[[bin]]
name = "fastty"
path = "src/main.rs"
required-features = []

[package.metadata.winres]
# Use the windows subsystem to hide console window

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
wgpu = { version = "22", default-features = false, features = ["wgsl"] }
alacritty_terminal = { version = "0.24", default-features = false }
portable-pty = "0.8"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
notify-debouncer-mini = "0.4"
seahash = "4"
anyhow = "1"
parking_lot = "0.12"
raw-window-handle = "0.6"
rustix = { version = "0.38", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
resvg = { version = "0.47.0", default-features = false, features = ["text"] }
usvg = { version = "0.47.0", default-features = false }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
rustybuzz = "0.12.1"
notify-rust = "4"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
notify = "6"
dirs = "6"

[build-dependencies]
winres = "0.1"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "22", default-features = false, features = ["wgsl", "webgl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "22", default-features = false, features = ["wgsl", "metal"] }
objc2 = "0.5"
core-text = "20"
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "22", default-features = false, features = ["wgsl", "dx12"] }
winres = "0.1"

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
freetype-rs = { version = "0.37" }

[target.'cfg(not(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64"))))'.dependencies]
freetype-rs = { version = "0.37", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true       # strips debug symbols — reduces binary size
panic = "unwind"    # enables crash reporting + auto-restart

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser_bench"
harness = false

