[package]
name = "fastty-wasm"
version = "0.13.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.128"
vte = "0.15.0"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "Window",
    "console",
] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

# wasm-opt stays off. wasm-pack resolves it by downloading one hardcoded
# binaryen tarball (version_117) at build time, and that asset being
# unreachable fails the whole build, wasm and all. With the download gone the
# build needs no network and no host tooling. Cost: web/pkg grows about 10 KB
# (104 KB to 114 KB). Re-enable only with binaryen provided by the runner.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
