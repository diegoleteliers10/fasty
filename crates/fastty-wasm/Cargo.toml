[package]
name = "fastty-wasm"
version = "0.7.7"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
vte = "=0.11.1"
unicode-width = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "Window",
    "console",
] }
